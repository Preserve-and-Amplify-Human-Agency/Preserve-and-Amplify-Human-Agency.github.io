name: Verify loading improvements
on:
  push:
    branches: [perf/banner-preload-stable-mobile]
    paths: [.github/workflows/verify-loading-improvements.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          npm install --global agent-browser
      - name: Apply only the two approved improvements
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          temp = Path(os.environ['RUNNER_TEMP'])
          original_html = Path('index.html').read_text()
          original_css = Path('styles.css').read_text()
          (temp / 'original-index.html').write_text(original_html)
          (temp / 'original-styles.css').write_text(original_css)
          protected = [p for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines() if p not in ('index.html', 'styles.css') and not p.startswith('.github/')]
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          (temp / 'protected-hashes.json').write_text(json.dumps(hashes))
          stylesheet = '  <link rel="stylesheet" href="styles.css?layout=masked-whitening&amp;images=web-optimized-v1">'
          preloads = '''  <link rel="preload" as="image" href="images/header-mobile.webp?layout=uncropped&amp;images=web-optimized-v1" type="image/webp" media="(max-width: 600px)" fetchpriority="high">
            <link rel="preload" as="image" href="images/header.webp?images=web-optimized-v1" type="image/webp" media="not all and (max-width: 600px)" fetchpriority="high">
            <!-- Use the final mobile layout before the deferred navigation script runs. -->
            <script>document.documentElement.classList.add("nav-pending");</script>'''
          preloads = preloads.replace('\n  ', '\n', 3)
          # Keep markup indentation consistent; indentation has no rendering effect.
          preloads = '\n'.join('  ' + line.strip() for line in preloads.splitlines())
          assert original_html.count(stylesheet) == 1
          html = original_html.replace(stylesheet, preloads + '\n' + stylesheet.replace('web-optimized-v1', 'web-optimized-v1&amp;navigation=stable-v1'))
          nav_script = '  <script src="section-navigation.js?layout=heading-dropdown" defer></script>'
          cleanup = "document.documentElement.classList.remove('nav-pending')"
          assert html.count(nav_script) == 1
          html = html.replace(nav_script, '  <script src="section-navigation.js?layout=heading-dropdown" defer onload="' + cleanup + '" onerror="' + cleanup + '"></script>')
          old_rule = '  .contents.is-enhanced { display: none; }'
          new_rule = '  /* Hide the temporary contents list until enhancement succeeds or loading fails. */\n  .nav-pending .contents, .contents.is-enhanced { display: none; }'
          assert original_css.count(old_rule) == 1
          css = original_css.replace(old_rule, new_rule)
          assert html.partition('<body>')[2] == original_html.partition('<body>')[2]
          assert css.replace(new_rule, old_rule) == original_css
          Path('index.html').write_text(html)
          Path('styles.css').write_text(css)
          for path, digest in hashes.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          PY
      - name: Verify rendered page with agent-browser
        run: |
          mkdir -p "$RUNNER_TEMP/loading-checks"
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/loading-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/loading-server.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 0.2
          done
          BROWSER_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          agent-browser --executable-path "$BROWSER_PATH" open http://127.0.0.1:8765/
          agent-browser wait --load networkidle
          agent-browser snapshot -i > "$RUNNER_TEMP/loading-checks/browser-snapshot.txt"
          agent-browser eval 'document.body.innerText.includes("Preserve and Amplify Human Agency") ? "HAS_CONTENT" : "BLANK"'
          agent-browser screenshot "$RUNNER_TEMP/loading-checks/desktop.png"
          agent-browser close
      - name: Verify early requests, delayed scripts, and navigation fallbacks
        run: |
          python - <<'PY'
          import asyncio, hashlib, json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.async_api import async_playwright, expect

          base = 'http://127.0.0.1:8765/'
          temp = Path(os.environ['RUNNER_TEMP'])
          out = temp / 'loading-checks'
          old_html = (temp / 'original-index.html').read_text()
          old_css = (temp / 'original-styles.css').read_text()
          frames = '() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))'
          state = '''() => {
            const box = selector => {const b = document.querySelector(selector).getBoundingClientRect(); return {top: b.top + scrollY, height: b.height};};
            return {about: box('#about'), heading: box('#about-title'), paragraph: box('#about > p'), main: box('#main'), header: box('.workshop-header')};
          }'''
          observe = '''window.testShifts = []; new PerformanceObserver(list => {for (const e of list.getEntries()) if (!e.hadRecentInput) window.testShifts.push(e.value);}).observe({type:'layout-shift', buffered:true});'''
          report = {'viewports': [], 'fallbacks': [], 'browser_errors': []}

          async def hold(route, future):
              if not future.done(): future.set_result(route)

          async def baseline(browser):
              context = await browser.new_context(viewport={'width':390, 'height':844}, device_scale_factor=2)
              page = await context.new_page()
              nav = asyncio.get_running_loop().create_future()
              await page.route(base, lambda route: route.fulfill(status=200, content_type='text/html', body=old_html))
              await page.route('**/styles.css*', lambda route: route.fulfill(status=200, content_type='text/css', body=old_css))
              await page.route('**/section-navigation.js*', lambda route: hold(route, nav))
              await page.goto(base, wait_until='commit')
              route = await asyncio.wait_for(nav, 15)
              await page.wait_for_function("document.querySelector('#about > p') && performance.getEntriesByType('paint').length > 0")
              await page.evaluate(frames)
              before = await page.evaluate(state)
              await route.continue_()
              await page.wait_for_load_state('networkidle')
              await page.evaluate(frames)
              after = await page.evaluate(state)
              report['original_mobile_paragraph_movement_px'] = round(after['paragraph']['top'] - before['paragraph']['top'], 3)
              await page.screenshot(path=str(out / 'original-mobile-settled.png'))
              await context.close()

          async def viewport(browser, width):
              context = await browser.new_context(viewport={'width':width, 'height':844 if width <= 900 else 1000}, device_scale_factor=2 if width <= 600 else 1)
              await context.add_init_script(observe)
              page = await context.new_page()
              errors, banners = [], []
              page.on('pageerror', lambda error: errors.append(str(error)))
              banner_seen = asyncio.Event()
              def request_seen(request):
                  if urlsplit(request.url).path in ('/images/header.webp', '/images/header-mobile.webp'):
                      banners.append(request.url)
                      banner_seen.set()
              page.on('request', request_seen)
              loop = asyncio.get_running_loop()
              css, nav = loop.create_future(), loop.create_future()
              await page.route('**/styles.css*', lambda route: hold(route, css))
              await page.route('**/section-navigation.js*', lambda route: hold(route, nav))
              await page.goto(base, wait_until='commit')
              css_route = await asyncio.wait_for(css, 15)
              await asyncio.wait_for(banner_seen.wait(), 15)
              # The banner was requested while the stylesheet response was still withheld.
              expected = '/images/header-mobile.webp' if width <= 600 else '/images/header.webp'
              assert [urlsplit(url).path for url in banners] == [expected], (width, banners)
              await css_route.continue_()
              nav_route = await asyncio.wait_for(nav, 15)
              await page.wait_for_function("document.querySelector('#about > p') && performance.getEntriesByType('paint').length > 0")
              await page.evaluate(frames)
              before = await page.evaluate(state)
              shift_count = await page.evaluate('testShifts.length')
              if width <= 900: await expect(page.locator('.contents')).to_be_hidden()
              else: await expect(page.locator('.contents')).to_be_visible()
              if width == 390: await page.screenshot(path=str(out / 'mobile-navigation-pending.png'))
              await nav_route.continue_()
              await page.wait_for_load_state('networkidle')
              await page.evaluate(frames)
              after = await page.evaluate(state)
              delta = max(abs(after[key][field] - before[key][field]) for key in before for field in before[key])
              assert delta < 0.1, (width, before, after)
              shifts = await page.evaluate('(start) => testShifts.slice(start).reduce((sum, value) => sum + value, 0)', shift_count)
              assert shifts < 0.001, (width, shifts)
              assert not await page.evaluate("document.documentElement.classList.contains('nav-pending')")
              assert [urlsplit(url).path for url in banners] == [expected], (width, banners)
              matches = await page.locator('link[rel="preload"]').evaluate_all('(links) => links.filter(link => matchMedia(link.media).matches).map(link => ({href:link.href, priority:link.fetchPriority, as:link.as}))')
              assert len(matches) == 1 and matches[0]['href'] == banners[0] and matches[0]['priority'] == 'high' and matches[0]['as'] == 'image', matches
              if width == 390: await page.screenshot(path=str(out / 'mobile-navigation-ready.png'))
              if width <= 900:
                  await expect(page.locator('.contents')).to_be_hidden()
                  button = page.locator('#about-title .section-toggle')
                  await button.scroll_into_view_if_needed()
                  await page.evaluate(frames)
                  await button.click()
                  await expect(page.locator('#mobile-section-navigation')).to_be_visible()
                  await page.keyboard.press('Escape')
                  await expect(page.locator('#mobile-section-navigation')).to_be_hidden()
                  await expect(button).to_be_focused()
                  await button.click()
                  await page.locator('#mobile-section-navigation a[href="#speakers"]').click()
                  await page.wait_for_function("location.hash === '#speakers'")
                  await expect(page.locator('#mobile-section-navigation')).to_be_hidden()
              else:
                  await page.locator('#section-navigation a[href="#speakers"]').click()
                  await page.wait_for_function("location.hash === '#speakers'")
              assert not errors, errors
              report['viewports'].append({'width':width, 'banner':expected, 'banner_requested_before_css_response':True, 'banner_request_count':len(banners), 'max_layout_movement_after_navigation_px':round(delta, 4), 'navigation_layout_shift_score':round(shifts, 6), 'navigation_works':True})
              await context.close()

          async def fallback(browser, mode):
              context = await browser.new_context(viewport={'width':390,'height':844}, java_script_enabled=mode != 'javascript-disabled')
              page = await context.new_page()
              if mode == 'script-download-failed': await page.route('**/section-navigation.js*', lambda route: route.abort())
              if mode == 'script-execution-failed': await page.route('**/section-navigation.js*', lambda route: route.fulfill(status=200, content_type='application/javascript', body='throw new Error("Intentional fallback test");'))
              await page.goto(base, wait_until='networkidle')
              await expect(page.locator('.contents')).to_be_visible()
              assert not await page.evaluate("document.documentElement.classList.contains('nav-pending')")
              await page.locator('#section-navigation a[href="#speakers"]').click()
              await page.wait_for_function("location.hash === '#speakers'")
              report['fallbacks'].append({'mode':mode, 'contents_visible':True, 'anchor_navigation_works':True})
              await context.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  await baseline(browser)
                  for width in (390, 600, 601, 768, 900, 901, 1440): await viewport(browser, width)
                  for mode in ('javascript-disabled', 'script-download-failed', 'script-execution-failed'): await fallback(browser, mode)
                  await browser.close()
              hashes = json.loads((temp / 'protected-hashes.json').read_text())
              for path, digest in hashes.items(): assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
              report['all_images_and_existing_javascript_unchanged'] = True
              report['page_body_unchanged'] = Path('index.html').read_text().partition('<body>')[2] == old_html.partition('<body>')[2]
              assert report['page_body_unchanged']
              (out / 'report.json').write_text(json.dumps(report, indent=2))
              print('TEST_REPORT=' + json.dumps(report), flush=True)
          asyncio.run(main())
          PY
      - name: Commit validated changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css
          git rm .github/workflows/verify-loading-improvements.yml
          git commit -m "Preload the matching banner and stabilize initial mobile layout"
          git push origin HEAD:perf/banner-preload-stable-mobile
      - name: Save verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loading-improvements-checks
          path: ${{ runner.temp }}/loading-checks
          retention-days: 7
      - name: Stop test server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/loading-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/loading-server.pid")" || true
          fi
