name: Optimize workshop images
on:
  push:
    branches: [perf/web-image-optimization]
    paths: [.github/workflows/optimize-web-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and browser tools
        run: |
          python -m pip install Pillow CairoSVG defusedxml playwright
          python -m playwright install --with-deps chromium
      - name: Optimize and verify images
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path
          from PIL import Image, ImageChops, ImageCms, ImageOps, ImageStat
          from defusedxml import ElementTree
          from playwright.sync_api import sync_playwright
          import cairosvg

          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'web-image-optimization'
          out.mkdir(parents=True, exist_ok=True)
          html_path = root / 'index.html'
          css_path = root / 'styles.css'
          html_before = html_path.read_text()
          css_before = css_path.read_text()
          html = html_before
          css = css_before
          rows = []
          cache = {}

          def srgb_image(image):
              image = ImageOps.exif_transpose(image)
              alpha = image.convert('RGBA').getchannel('A') if 'A' in image.getbands() or 'transparency' in image.info else None
              icc = image.info.get('icc_profile')
              if icc:
                  image = ImageCms.profileToProfile(image.convert('RGB'), ImageCms.ImageCmsProfile(io.BytesIO(icc)), ImageCms.createProfile('sRGB'), outputMode='RGB')
              else:
                  image = image.convert('RGB')
              if alpha is not None:
                  image.putalpha(alpha)
              return image

          def webp_bytes(image, quality):
              output = io.BytesIO()
              image.save(output, format='WEBP', quality=quality, method=6)
              data = output.getvalue()
              with Image.open(io.BytesIO(data)) as check:
                  check.load()
                  assert check.size == image.size
              return data

          server = subprocess.Popen(['python', '-m', 'http.server', '8765', '--bind', '127.0.0.1'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(1)
          views = [('desktop', 1440, 1000, 1), ('mobile', 390, 844, 2)]

          def capture(browser, phase):
              states = {}
              for name, width, height, dpr in views:
                  context = browser.new_context(viewport={'width': width, 'height': height}, device_scale_factor=dpr)
                  page = context.new_page()
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/', wait_until='networkidle')
                  page.evaluate("""async () => {
                    const images = Array.from(document.images);
                    images.forEach(image => image.loading = 'eager');
                    await Promise.all(images.map(image => image.decode()));
                    const background = getComputedStyle(document.querySelector('.workshop-header')).backgroundImage;
                    const urls = Array.from(background.matchAll(/url\([\"']?(.*?)[\"']?\)/g), match => match[1]);
                    await Promise.all(urls.map(url => new Promise((resolve, reject) => {
                      const image = new Image(); image.onload = resolve; image.onerror = reject; image.src = url;
                    })));
                    await document.fonts.ready;
                    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                  }""")
                  header = page.locator('.workshop-header')
                  header.screenshot(path=str(out / f'{phase}-{name}-header.png'))
                  page.locator('#speakers .people').screenshot(path=str(out / f'{phase}-{name}-portraits.png'))
                  states[name] = page.evaluate("""() => ({
                    text: document.body.innerText,
                    images: Array.from(document.images, image => ({src: image.getAttribute('src'), loaded: image.complete && image.naturalWidth > 0})),
                    boxes: Array.from(document.querySelectorAll('.workshop-header, .portrait-frame'), element => {
                      const box = element.getBoundingClientRect(); return [box.width, box.height];
                    })
                  })""")
                  assert all(image['loaded'] for image in states[name]['images']), states[name]
                  assert not errors, errors
                  context.close()
              return states

          try:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch()
                  before = capture(browser, 'before')
                  portraits = sorted(set(re.findall(r'src="(images/[^"?]+\.png)"', html)))
                  assert len(portraits) == 14, f'Unexpected portrait count: {len(portraits)}'
                  for relative in portraits:
                      source = root / relative
                      with Image.open(source) as original:
                          old_size = original.size
                          image = srgb_image(original)
                          factor = min(1.0, 360 / min(image.size))
                          size = tuple(max(1, round(value * factor)) for value in image.size)
                          if size != image.size:
                              image = image.resize(size, Image.Resampling.LANCZOS)
                          data = webp_bytes(image, 82)
                      assert len(data) < source.stat().st_size
                      destination = source.with_suffix('.webp')
                      assert not destination.exists(), f'Will not overwrite {destination}'
                      destination.write_bytes(data)
                      html = html.replace(f'src="{relative}"', f'src="{destination.relative_to(root).as_posix()}"')
                      rows.append({'asset': relative, 'type': 'portrait', 'before': source.stat().st_size, 'after': len(data), 'original_dimensions': old_size, 'dimensions': size, 'served_as': destination.relative_to(root).as_posix()})

                  pattern = re.compile(r'data:image/(?:png|jpe?g);base64,[A-Za-z0-9+/=\r\n]+')
                  for filename in ('header.svg', 'header-mobile.svg'):
                      source = root / 'images' / filename
                      text = source.read_text()
                      original_bytes = source.stat().st_size
                      svg = ElementTree.fromstring(text)
                      embedded = []
                      def compress_embedded(match):
                          value = match.group(0)
                          key = hashlib.sha256(value.encode()).hexdigest()
                          if key not in cache:
                              raw = base64.b64decode(value.split(',', 1)[1])
                              with Image.open(io.BytesIO(raw)) as original:
                                  old_size = original.size
                                  image = srgb_image(original)
                                  image.thumbnail((2160, 2160), Image.Resampling.LANCZOS)
                                  data = webp_bytes(image, 85)
                                  size = image.size
                              encoded = 'data:image/webp;base64,' + base64.b64encode(data).decode('ascii')
                              cache[key] = (encoded if len(encoded) < len(value) else value, old_size, size)
                          replacement, old_size, size = cache[key]
                          embedded.append({'original_dimensions': old_size, 'dimensions': size})
                          return replacement
                      updated, count = pattern.subn(compress_embedded, text)
                      served_as = 'images/' + filename
                      if count:
                          assert len(updated.encode()) < original_bytes, f'No reduction for {filename}'
                          source.write_text(updated)
                          new_bytes = source.stat().st_size
                          # Only the bitmap payload changes; SVG geometry and masks remain identical.
                          assert pattern.sub('BITMAP', text) == re.sub(r'data:image/(?:png|jpe?g|webp);base64,[A-Za-z0-9+/=\r\n]+', 'BITMAP', updated)
                      else:
                          viewbox = [float(value) for value in re.split(r'[ ,]+', svg.attrib['viewBox'].strip())]
                          scale = 2
                          png = cairosvg.svg2png(bytestring=text.encode(), output_width=round(viewbox[2] * scale), output_height=round(viewbox[3] * scale))
                          with Image.open(io.BytesIO(png)) as original:
                              image = srgb_image(original)
                              data = webp_bytes(image, 85)
                          assert len(data) < original_bytes, f'No reduction for {filename}'
                          destination = source.with_suffix('.webp')
                          assert not destination.exists()
                          destination.write_bytes(data)
                          served_as = destination.relative_to(root).as_posix()
                          css = css.replace('images/' + filename, served_as)
                          new_bytes = len(data)
                      rows.append({'asset': 'images/' + filename, 'type': 'header', 'before': original_bytes, 'after': new_bytes, 'embedded_images': embedded, 'served_as': served_as})

                  # Refresh cached CSS and any header SVG whose embedded bitmap changed.
                  css = re.sub(r'(url\("images/header(?:-mobile)?\.(?:svg|webp))([^"\)]*)("\))', lambda match: match[1] + match[2] + ('&' if '?' in match[2] else '?') + 'images=web-optimized-v1' + match[3], css)
                  html = html.replace('styles.css?layout=masked-whitening', 'styles.css?layout=masked-whitening&amp;images=web-optimized-v1')
                  html_path.write_text(html)
                  css_path.write_text(css)
                  after = capture(browser, 'after')
                  browser.close()
                  checks = {}
                  for name, _, _, _ in views:
                      assert before[name]['text'] == after[name]['text'], f'Text changed on {name}'
                      assert before[name]['boxes'] == after[name]['boxes'], f'Layout changed on {name}'
                      for section in ('header', 'portraits'):
                          with Image.open(out / f'before-{name}-{section}.png') as old, Image.open(out / f'after-{name}-{section}.png') as new:
                              assert old.size == new.size
                              difference = ImageChops.difference(old.convert('RGB'), new.convert('RGB'))
                              mae = sum(ImageStat.Stat(difference).mean) / 3
                              checks[f'{name}-{section}-mean_pixel_difference'] = round(mae, 3)
                              assert mae < 12, f'Unexpected visual difference: {name} {section} {mae}'
                  report = {'assets': rows, 'visual_checks': checks, 'portrait_count': len(portraits), 'total_before': sum(row['before'] for row in rows), 'total_after': sum(row['after'] for row in rows), 'original_portraits_retained': True, 'page_text_unchanged': True, 'layout_unchanged': True, 'browser_errors': []}
                  report['reduction_percent'] = round(100 * (1 - report['total_after'] / report['total_before']), 2)
                  (out / 'report.json').write_text(json.dumps(report, indent=2))
                  print(json.dumps(report, indent=2), flush=True)
          finally:
              server.terminate()
          PY
      - name: Commit verified image changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images index.html styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Optimize portraits and header images for faster web loading"
            git push origin HEAD:perf/web-image-optimization
          fi
      - name: Save size report and visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-image-optimization-report
          path: ${{ runner.temp }}/web-image-optimization
          retention-days: 7
